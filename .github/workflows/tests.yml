name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test,ui]'
      - run: python -m pytest -q
      - run: python -m compileall -q src

  streamlit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ui]' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise all five Streamlit pages
        run: |
          python -m streamlit run streamlit_app.py --server.headless=true --server.port=8767 --browser.gatherUsageStats=false > streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/_stcore/health; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamlit-workbench-verification
          path: |
            streamlit.log
            workbench-screenshots/
