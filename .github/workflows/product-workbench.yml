name: Workbench product
on:
  pull_request:
  push:
    branches: [feat/workbench-product-v2]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench_admin
          POSTGRES_PASSWORD: workbench-local-admin
        options: >-
          --health-cmd "pg_isready -U workbench_admin -d workbench"
          --health-interval 3s --health-timeout 3s --health-retries 15
        ports:
          - 5432:5432
    env:
      WORKBENCH_DATABASE_URL: postgresql+psycopg://workbench_admin:workbench-local-admin@127.0.0.1:5432/workbench
      WORKBENCH_TEST_DATABASE_URL: postgresql+psycopg://workbench_runtime:workbench-local-runtime@127.0.0.1:5432/workbench
      WORKBENCH_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install '.[test,product]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Migrate clean PostgreSQL and exercise rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import psycopg
          url = os.environ["WORKBENCH_DATABASE_URL"].replace("postgresql+psycopg:", "postgresql:")
          with psycopg.connect(url, autocommit=True) as connection:
              connection.execute(Path("deployment/workbench-init.sql").read_text())
          PY
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - run: python -m pytest -q tests/test_product.py
      - name: Verify in Chromium with a separate worker
        env:
          WORKBENCH_DATABASE_URL: ${{ env.WORKBENCH_TEST_DATABASE_URL }}
        run: |
          python -m uvicorn src.product.api:create_app --factory --port 8001 > product-api.log 2>&1 &
          api_pid=$!
          python -m src.product.worker > product-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/healthz; then break; fi
            sleep 1
          done
          python tests/product_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workbench-product-logs
          path: |
            product-api.log
            product-worker.log
